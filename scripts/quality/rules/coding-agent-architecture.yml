groups:
  platformPersistenceRoots:
    - path: apps/cli-host/src/rpc/runtime-host/cli-session-assembly.ts
      factory: createFileConversationPersistence
    - path: packages/runtime-desktop/src/backend-pool.ts
      factory: createFileConversationPersistence
    - path: apps/desktop/src/main/knowledge/processing-session-factory.ts
      factory: createFileConversationPersistence
  workspaceFactInjections:
    - path: apps/cli-host/src/rpc/runtime-host/cli-session-assembly.ts
      regex: '\bworkspaceFacts\s*:'
    - path: packages/runtime-desktop/src/backend-pool.ts
      regex: '\bworkspaceFacts\s*:'
    - path: packages/coding-agent/src/host/sdk-session/node-session-host.ts
      regex: '\bworkspaceFacts\s*[,/:]'
    - path: apps/desktop/src/main/knowledge/processing-session-factory.ts
      regex: '\bresolveWorkspaceFacts\s*:'
rules:
  - name: retired-multi-host-concepts
    doc: ADR-0077
    steps:
      - op: eachFile
        steps:
          - op: eachText
            includesFrom: retiredHostNames
            report: "{path} references retired multi-Host concept {item}"
          - op: when
            pathPrefix: packages/coding-agent/src/
            steps:
              - op: when
                textRegex: '\b(?:composition|childComposition)\.backend\.(?:create|resume)\s*\('
                report: "{path} calls the deprecated product Backend facade instead of composition.sessions"
              - op: eachText
                includesFrom: retiredOwnershipMethods
                report: "{path} references retired duplicate Session resource ownership {item}"
  - name: platform-persistence-composition
    doc: ADR-0077
    steps:
      - op: eachItem
        itemsFrom: platformPersistenceRoots
        skipIfAbsent: true
        steps:
          - op: unlessImport
            specifier: "@vetta/runtime-node/conversation"
            name: "{factory}"
            report: "{path}: platform Composition Root must select {factory} from runtime-node"
          - op: unlessText
            regex: '\bcreateConversationPersistence\s*:'
            report: "{path}: platform Composition Root must inject createConversationPersistence"
  - name: composition-persistence-boundary
    doc: ADR-0077
    steps:
      - op: eachEdge
        steps:
          - op: when
            pathPrefix: packages/coding-agent/src/composition/
            specifierExact: "@vetta/runtime-node/conversation"
            report: "{path}:{line}: Coding Agent Composition must consume a persistence Port, not a Node implementation"
      - op: file
        path: packages/coding-agent/src/composition/runtime-composition.ts
        steps:
          - op: unlessText
            regex: '\boptions\.createConversationPersistence\s*\('
            report: "{path}: Coding Agent Composition must obtain conversation persistence from its host Port"
  - name: tool-environment-boundary
    doc: ADR-0077
    steps:
      - op: eachFile
        steps:
          - op: when
            pathPrefix: packages/coding-agent/src/adapters/runtime-tools/
            report: "{path}: Node command and executable implementations belong to runtime-node"
      - op: eachEdge
        steps:
          - op: when
            pathExact: packages/coding-agent/src/composition/tool-surface/runtime-tools-composition.ts
            specifierExact: "@vetta/runtime-node/coding"
            report: "{path}:{line}: Coding Agent tool composition must consume ToolEnvironment, not Node tools"
          - op: when
            pathPrefix: packages/coding-agent/src/tool-policy/path/
            specifierPrefixFrom: nodeSpecifierPrefixes
            report: "{path}:{line}: Coding Agent path policy must consume Host path boundaries"
          - op: when
            pathExact:
              - packages/coding-agent/src/execution/session/runtime.ts
              - packages/coding-agent/src/execution/sandbox/tool-registrations.ts
            specifierPrefixFrom: nodeSpecifierPrefixes
            report: "{path}:{line}: Session execution must consume its Host environment Port"
      - op: file
        path: packages/coding-agent/src/composition/runtime-composition.ts
        steps:
          - op: unlessText
            regex: '\bcreateToolEnvironment\s*:\s*options\.createToolEnvironment\b'
            report: "{path}: Coding Agent Composition must forward the host ToolEnvironment factory"
      - op: eachItem
        itemsFrom: toolEnvironmentRoots
        skipIfAbsent: true
        steps:
          - op: unlessText
            regex: '\bcreateToolEnvironment\s*(?::|,)'
            report: "{path}: host Composition Root must inject createToolEnvironment"
          - op: unlessText
            regex: '\bcreateSessionExecutionEnvironment\s*(?::|,)'
            report: "{path}: host Composition Root must inject createSessionExecutionEnvironment"
      - op: eachItem
        itemsFrom: migratedToolEnvironmentRoots
        skipIfAbsent: true
        steps:
          - op: when
            textRegex: '\bcreateCodingAgentNodeToolEnvironment\b'
            report: "{path}: platform Composition Root must not select Coding Agent's legacy Node factory"
          - op: when
            textRegex: '\bcreateCodingAgentNodeSessionExecutionEnvironment\b'
            report: "{path}: platform Composition Root must not select Coding Agent's legacy Session environment"
      - op: eachItem
        itemsFrom: platformEnvironmentFactories
        skipIfAbsent: true
        steps:
          - op: unlessAll
            checks:
              - textRegex: '\bcreateNodeHostCodingToolEnvironment\b'
              - textRegex: '\bcreateNodeHostSessionCommandEnvironment\b'
              - textRegex: '\bcreateNodeSandboxCodingToolEnvironment\b'
              - textRegex: '\bcreateCodingAgentEditPathPolicy\b'
              - textRegex: '\bcreateCodingAgentWritePathPolicy\b'
            report: "{path}: platform environment factory must compose Node mechanisms with Coding Agent policies"
  - name: prompt-request-adapter
    doc: ADR-0077
    steps:
      - op: file
        path: packages/coding-agent/src/adapters/runtime-core/prompt-request-adapter.ts
        steps:
          - op: eachEdge
            steps:
              - op: when
                pathExact: packages/coding-agent/src/adapters/runtime-core/prompt-request-adapter.ts
                specifierPrefix: ["../../plugins/", "../../extensions/", "@vetta/ecosystem-adapter"]
                report: "{path}:{line}: Prompt request Adapter must delegate domain policy"
          - op: unlessAll
            checks:
              - textRegex: 'private readonly runtime:\s*CodingAgentPromptRequestRuntime'
              - textRegex: 'this\.runtime\.prepare\(readPromptRequest\(inputRequest\.payload\), context\)'
            report: "{path}: Prompt request Adapter must delegate preparation to its runtime Port"
  - name: retired-concurrency
    doc: ADR-0077
    steps:
      - op: eachSourcePath
        steps:
          - op: when
            pathPrefix: packages/coding-agent/src/concurrency/
            report: "{path}: generic concurrency belongs to Runtime Tools"
      - op: ifExport
        names: ["./concurrency"]
        report: "{path}: generic concurrency must not be published by Coding Agent"
  - name: retired-configuration
    doc: ADR-0077
    steps:
      - op: eachSourcePath
        steps:
          - op: when
            pathPrefix: packages/coding-agent/src/configuration/
            report: "{path}: environment configuration resolution belongs to the platform Runtime"
      - op: ifExport
        names: ["./configuration"]
        report: "{path}: environment configuration resolution must not be published by Coding Agent"
  - name: retired-utils
    doc: ADR-0077
    steps:
      - op: eachSourcePath
        steps:
          - op: when
            pathPrefix: packages/coding-agent/src/utils/
            report: "{path}: generic utility dumping ground is retired; place code in its owning domain"
  - name: cli-host-boundary
    doc: ADR-0077
    steps:
      - op: eachSourcePath
        steps:
          - op: when
            pathExactFrom: retiredCliPaths
            report: "{path}: terminal CLI behavior belongs to cli-host"
      - op: ifExport
        names: ["./cli-control"]
        report: "{path}: CLI process control must not be published by Coding Agent"
      - op: file
        path: packages/coding-agent/src/host/coding-agent-print-invocation.ts
        steps:
          - op: when
            textRegex: '\bprocess\s*\.|\bconsole\.(?:log|error)\s*\('
            report: "{path}: Print input assembly must consume host-provided I/O Ports"
  - name: retired-adapter-ownership
    doc: ADR-0077
    steps:
      - op: eachSourcePath
        steps:
          - op: when
            pathExactFrom: retiredAdapterPaths
            report: "{path}: implementation belongs to its Extension or ecosystem owner"
  - name: node-state-backend
    doc: ADR-0077
    steps:
      - op: eachFile
        steps:
          - op: when
            pathExactFrom: retiredNodeStatePaths
            report: "{path}: Node file state backends belong to runtime-node"
      - op: eachEdge
        steps:
          - op: when
            pathPrefix: packages/coding-agent/src/settings/
            specifierPrefixFrom: nodeSpecifierPrefixes
            report: "{path}:{line}: Settings semantics must consume SettingsStoragePort, not a Node backend"
      - op: file
        path: packages/coding-agent/src/settings/index.ts
        steps:
          - op: when
            textRegex: '\bcreate\s*:\s*createFileSettingsRuntime\b'
            report: "{path}: SettingsRuntime must not select a Node file backend"
  - name: extension-module-boundary
    doc: ADR-0077
    steps:
      - op: eachFile
        steps:
          - op: when
            pathExactFrom: retiredExtensionPaths
            report: "{path}: Node Extension execution belongs behind Host Ports"
          - op: when
            pathPrefix: packages/coding-agent/src/extensions/
            textRegexAny: ['\bBuffer\b', '\bNodeJS\s*\.']
            report: "{path}: Extension contracts must use platform-neutral data types"
      - op: eachEdge
        steps:
          - op: when
            pathPrefix: packages/coding-agent/src/extensions/
            specifierPrefixFrom: nodeSpecifierPrefixes
            report: "{path}:{line}: Extension semantics must not depend on Node implementations"
  - name: resource-access-boundary
    doc: ADR-0077
    steps:
      - op: eachEdge
        steps:
          - op: when
            pathExactFrom: portableResourcePaths
            specifierPrefixFrom: nodeSpecifierPrefixes
            report: "{path}:{line}: portable resource access must consume ResourceAccessPort, not a Node implementation"
      - op: file
        path: packages/coding-agent/src/resources/contracts/resource-runtime.ts
        steps:
          - op: unlessText
            regex: '\bresourceAccess\s*:\s*ResourceAccessPort\b'
            report: "{path}: SessionResourceRuntimeOptions must require ResourceAccessPort"
          - op: unlessText
            regex: '\bthemeParser\s*:\s*ThemeResourceParser\b'
            report: "{path}: SessionResourceRuntimeOptions must require ThemeResourceParser"
          - op: unlessAll
            checks:
              - textRegex: '\bextensionFactoryLoader\s*:\s*ExtensionFactoryLoader\b'
              - textRegex: '\bextensionCommandExecutor\s*:\s*ExtensionCommandExecutor\b'
            report: "{path}: SessionResourceRuntimeOptions must require Extension Host Ports"
      - op: eachFile
        steps:
          - op: when
            pathPrefix: packages/coding-agent/src/resources/
            textRegex: '\breadSkillContent\b'
            report: "{path}: Skill consumers must use the materialized resource snapshot"
  - name: command-execution-boundary
    doc: ADR-0077
    steps:
      - op: eachEdge
        steps:
          - op: when
            pathPrefix: packages/coding-agent/src/host/command-execution/
            specifierPrefix: "node:"
            report: "{path}:{line}: command execution implementation belongs to runtime-node, not Coding Agent"
  - name: execution-mode-host
    doc: ADR-0077
    steps:
      - op: eachFile
        steps:
          - op: when
            pathPrefix: packages/coding-agent/src/adapters/runtime-core/execution-mode/
            report: "{path}: sandbox host policy must not return to the Runtime adapter directory"
          - op: when
            pathExactFrom: sandboxPlatformFiles
            report: "{path}: OS sandbox implementation belongs to runtime-node"
          - op: when
            pathPrefix: packages/coding-agent/src/execution/sandbox/
            textRegexAny: ['\bNodeJS\s*\.', '\bprocess\s*\.']
            report: "{path}: sandbox policy must consume Host Services, not Node globals"
