# Live Coding Agent architecture rules. check-coding-agent-architecture.mjs loads this file.
# The generic forbidden-import engine does not. Add a rule here instead of editing the checker.
# Violation text stays identical to the legacy checker so the differential test can compare it.
name: coding-agent-architecture
description: Coding Agent dependency direction, host injection, and public package surface.
rationale: |
  Coding Agent owns product policy and stable facades. Contracts do not depend on
  adapters, composition implementations, or host implementations. Product domains
  do not select Node mechanisms. Hosts inject those mechanisms at the composition
  root. ADR-0077 records the ownership split. The readable contract is
  docs/dev/quality-gates.md and packages/coding-agent/AGENTS.md.
docs:
  - ADR-0077
  - docs/dev/quality-gates.md
  - packages/coding-agent/AGENTS.md
examples:
  - violation: |
      // packages/coding-agent/src/composition/contracts/sample.ts
      import type { Value } from "../../adapters/runtime-core/adapter.js";
    fix: |
      // Depend on a contract, not an adapter implementation.
      import type { Value } from "../runtime-contracts/index.js";
  - violation: |
      // apps/cli-host/src/runtime.ts
      import { value } from "@vetta/coding-agent/src/private.js";
    fix: |
      // Import a subpath declared in package.json#exports.
      import { value } from "@vetta/coding-agent/composition";
package:
  root: packages/coding-agent
  sourceRoot: packages/coding-agent/src
  specifier: "@vetta/coding-agent"
  manifest: packages/coding-agent/package.json
compositionPublic:
  sameDirectory: packages/coding-agent/src/composition
  prefixes:
    - packages/coding-agent/src/composition/contracts/
    - packages/coding-agent/src/composition/session-host/
    - packages/coding-agent/src/host/runtime-host/
    - packages/coding-agent/src/sessions/setup/
    - packages/coding-agent/src/tool-results/
  externalSpecifiers:
    - "@vetta/runtime-storage/conversation"
scan:
  sourceRoot: packages/coding-agent/src
  sourceExtensions: [".ts", ".tsx"]
  consumerRoots: [packages, apps]
  consumerExtensions: [".ts", ".tsx", ".js", ".mjs", ".cjs"]
  skipContains: ["/node_modules/", "/dist/"]
  consumerTextIncludes: ["@vetta/coding-agent"]
  consumerPaths:
    - packages/runtime-node/src/coding/index.ts
  consumerPrefixes:
    - packages/runtime-node/src/coding/tools/kb-
classes:
  contract:
    any:
      - prefix: packages/coding-agent/src/runtime-contracts/
      - prefix: packages/coding-agent/src/composition/contracts/
      - prefix: packages/coding-agent/src/host/sdk-session/contracts/
      - exact: packages/coding-agent/src/composition/knowledge-processing-contract.ts
      - suffix: "-contract.ts"
      - suffix: "/contracts.ts"
      - suffix: "/runtime-contracts.ts"
  domain:
    all:
      - anyPrefix:
          - packages/coding-agent/src/execution/
          - packages/coding-agent/src/extensions/
          - packages/coding-agent/src/features/
          - packages/coding-agent/src/memory/
          - packages/coding-agent/src/mcp/
          - packages/coding-agent/src/model-context/
          - packages/coding-agent/src/plugins/
          - packages/coding-agent/src/resources/
          - packages/coding-agent/src/rpc/
          - packages/coding-agent/src/sessions/
          - packages/coding-agent/src/theme/
      - not: contract
  adapter:
    any:
      - prefix: packages/coding-agent/src/adapters/
  publicContract:
    all:
      - prefix: packages/coding-agent/src/public-api/sdk/
      - class: contract
  publicFacade:
    all:
      - prefix: packages/coding-agent/src/public-api/
      - not: publicContract
  compositionImplementation:
    all:
      - prefix: packages/coding-agent/src/composition/
      - not: contract
  hostImplementation:
    all:
      - prefix: packages/coding-agent/src/host/
      - not: contract
  implementation:
    anyClass: [adapter, compositionImplementation, hostImplementation, publicFacade]
  historicalExecution:
    any:
      - class: adapter
      - prefix: packages/coding-agent/src/composition/
      - prefix: packages/coding-agent/src/execution/
      - prefix: packages/coding-agent/src/host/
      - prefix: packages/coding-agent/src/modes/
      - prefix: packages/coding-agent/src/public-api/sdk
