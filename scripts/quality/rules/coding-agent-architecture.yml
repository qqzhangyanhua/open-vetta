    - packages/runtime-node/src/coding/tools/progress/
    - packages/runtime-node/src/coding/tools/task-output/
    - packages/runtime-node/src/coding/tools/task-stop/
    - packages/runtime-node/src/coding/tools/im-send-attachment/
  portableProductCompositionPaths:
