          - op: unlessText
            regex: CodingAgentSdkSessionIdentityRuntime
            report: "{path}: Node SDK identity adapter must implement the identity runtime Port"
  - name: retired-layer-terminology
    doc: ADR-0077
    steps:
      - op: retiredTerm
        term: product
        scopePrefix: packages/coding-agent/src/
        fileReport: "{path}: implementation uses a retired architecture-layer term"
        exportReport: "{path}: export {export} uses a retired architecture-layer term"
  - name: dependency-direction
    doc: ADR-0077
    steps:
      - op: eachSourcePath
        steps:
          - op: when
            pathPrefix:
              - packages/coding-agent/src/core/
              - packages/coding-agent/src/compat/
            report: "{path}: retired implementation directory is outside the current architecture"
      - op: eachEdge
        steps:
          - op: when
            pathPrefix: packages/coding-agent/src/adapters/
            specifierPrefixFrom: nodeSpecifierPrefixes
            report: "{path}:{line}: Adapter must consume platform-neutral facts, not a Node implementation"
          - op: when
            pathExact: packages/coding-agent/src/index.ts
            steps:
              - op: whenAny
                checks:
                  - kindNot: export
                  - specifierNot: ./public-api/extensions.js
                report: "{path}:{line}: package root may only export the Extension facade"
          - op: when
            pathExact: packages/coding-agent/src/composition/index.ts
            kind: export
            notCompositionPublic: true
            report: "{path}:{line}: Composition public entry exports an internal implementation ({specifier})"
          - op: when
            outsidePackage: true
            specifierPackagePrefix: true
            unpublished: true
            report: "{path}:{line}: consumer uses a non-public Coding Agent subpath ({specifier})"
          - op: when
            pathPrefix: packages/coding-agent/src/
            namesIncludes: migrateLegacySessionToV2
            report: "{path}:{line}: historical migration execution must be injected by a Host"
          - op: when
            pathPrefix: packages/coding-agent/src/sessions/legacy/
            specifierPrefixFrom: nodeSpecifierPrefixes
            report: "{path}:{line}: historical format policy must consume host-provided file operations"
          - op: when
            pathPrefix: packages/coding-agent/src/sessions/external/
            specifierPrefixFrom: nodeSpecifierPrefixes
            report: "{path}:{line}: external format policy must consume host-provided file operations"
          - op: whenTargetInside
            steps:
              - op: when
                pathClass: contract
                targetClass: implementation
                report: "{path}:{line}: contract depends on implementation ({specifier})"
              - op: when
                pathClass: domain
                targetClassAny: [adapter, compositionImplementation, publicFacade]
                report: "{path}:{line}: Coding Agent domain depends on orchestration or implementation ({specifier})"
              - op: when
                pathClass: adapter
                targetClassAny: [compositionImplementation, publicFacade]
                report: "{path}:{line}: Adapter depends on Composition or a public facade ({specifier})"
              - op: when
                pathPrefix: packages/coding-agent/src/sessions/legacy/
                targetClass: historicalExecution
                report: "{path}:{line}: historical format boundary depends on Agent execution ({specifier})"
              - op: when
                pathPrefix: packages/coding-agent/src/sessions/external/
                targetClass: historicalExecution
                report: "{path}:{line}: external format boundary depends on Agent execution ({specifier})"
      - op: eachItem
        itemsFrom: historicalHostPaths
        skipIfAbsent: true
        steps:
          - op: unlessText
            regex: '\bcreateNodeLegacySessionHost\s*\('
            report: "{path}: platform historical-session Host must inject Node file execution"
